<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filterable List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="filter">
  <h1 class="filter__title">Filterable List</h1>
  <input
          class="filter__input"
          type="text"
          id="searchInput"
          placeholder="Search..."
          aria-label="Search"
  >
  <ul class="filter__list">
    <li class="filter__item">Item 1 Alex</li>
    <li class="filter__item">Item 2 Olga</li>
    <li class="filter__item">Item 3</li>
    <li class="filter__item">Item 4 Anton</li>
    <li class="filter__item">Item 5 HTML</li>
    <li class="filter__item">Item 6 CSS</li>
    <li class="filter__item">Item 7 JS</li>
    <li class="filter__item">Item 8</li>
    <li class="filter__item">Item 9</li>
    <li class="filter__item">Item 10</li>
  </ul>
</main>
</body>
</html>
