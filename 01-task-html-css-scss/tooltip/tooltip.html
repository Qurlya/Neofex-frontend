<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip</title>
    <link rel="stylesheet" href="tooltip.css">
</head>
<body>
<main>
    <span class="tooltip"
          tabindex="0"
          aria-describedby="tooltip-text">
        Наведите для подсказки
        <span class="tooltip__text"
              id="tooltip-text"
              role="tooltip">
            Ваша подсказка здесь
        </span>
    </span>
</main>
</body>
</html>
